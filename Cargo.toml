[package]
name = "yt-dlp"
edition = "2024"
version = "1.4.11"

authors = ["boul2gom <contact@boul2gom.fr>"]
description = "🎬️ A Rust library (with auto dependencies installation) for Youtube downloading"

license = "GPL-3.0"
readme = "README.md"
documentation = "https://docs.rs/yt-dlp"
homepage = "https://github.com/boul2gom/yt-dlp"
repository = "https://github.com/boul2gom/yt-dlp"

categories = ["api-bindings", "asynchronous", "multimedia", "multimedia::audio", "multimedia::video"]
keywords = ["youtube", "downloader", "async", "yt-dlp", "youtube-dl"]

[package.metadata.docs.rs]
all-features = true

[workspace.metadata.release]
shared-version = true
tag-message = "🔖 v{{version}}"
pre-release-commit-message = "🚧 v{{version}}"
pre-release-replacements = [
  {file="README.md", search="yt-dlp = \"[^\"]*\"", replace="yt-dlp = \"{{version}}\"", exactly=1},
  {file="README.md", search="yt-dlp = \\{ version = \"[^\"]*\", features = \\[\"tracing\"\\], default-features = false \\}", replace="yt-dlp = { version = \"{{version}}\", features = [\"tracing\"], default-features = false }", exactly=1},
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["reqwest/default", "cache", "tracing"]

# Internal umbrella feature — set automatically by any cache backend. Do not enable directly.
cache-backend = []
# In-memory LRU cache backend (no persistence). Enable with features = ["cache"].
cache = ["cache-backend", "dep:lru"]
# JSON file cache backend (default). Enable with features = ["cache-json"].
cache-json = ["cache-backend"]
# SQLite cache backend. Enable with features = ["cache-sqlite"].
cache-sqlite = ["cache-backend", "dep:sqlx"]

tracing = ["dep:tracing"]
rustls = ["reqwest/rustls"]
hooks = []
webhooks = []

[dependencies]
# The `cargo-outdated` tool is used with: `cargo outdated --root-deps-only`

# Runtime and async dependencies
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "fs", "time", "process", "io-util"], default-features = false }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
async-trait = "0.1.89"
reqwest = { version = "0.13.2", features = ["json", "stream", "http2", "charset"], default-features = false }
futures-util = "0.3.32"

# Cache backend dependencies (optional)
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["sqlite", "runtime-tokio", "derive", "macros"] }
lru = { version = "0.16.3", optional = true }

# Serialization dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.16.0"

# Error handling dependencies
derive_more = { version = "2.1.1", features = ["constructor", "display", "from", "into", "debug"] }
thiserror = "2.0.18"

# Audio and video dependencies
mp4ameta = "0.13.0"
id3 = "1.16.4"

# Misc and utility dependencies
ordered-float = { version = "5.1.0", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
url = "2.5.8"
regex = "1.12.3"
sha2 = "0.10.9"
chrono = "0.4.43"
tar = "0.4.44"
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
xz2 = "0.1.7"
rand = "0.10.0"
lazy_static = "1.5.0"
itertools = "0.14"
tap = "1.0.1"
dyn-clone = "1.0.20"
typed-builder = "0.23.2"
cfg-if = "1.0.4"
downcast-rs = "2.0.2"
tempfile = "3.25.0"

# Logging dependencies
tracing = { version = "0.1.44", optional = true }

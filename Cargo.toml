[package]
name = "yt-dlp"
edition = "2024"
version = "1.4.7"

authors = ["boul2gom <contact@boul2gom.fr>"]
description = "🎬️ A Rust library (with auto dependencies installation) for Youtube downloading"

license = "GPL-3.0"
readme = "README.md"
documentation = "https://docs.rs/yt-dlp"
homepage = "https://github.com/boul2gom/yt-dlp"
repository = "https://github.com/boul2gom/yt-dlp"

categories = ["api-bindings", "asynchronous", "multimedia", "multimedia::audio", "multimedia::video"]
keywords = ["youtube", "downloader", "async", "yt-dlp", "youtube-dl"]

[package.metadata.docs.rs]
all-features = true

[workspace.metadata.release]
shared-version = true
tag-message = "🔖 v{{version}}"
pre-release-commit-message = "🚧 v{{version}}"
pre-release-replacements = [
  {file="README.md", search="yt-dlp = \"[^\"]*\"", replace="yt-dlp = \"{{version}}\"", exactly=1},
  {file="README.md", search="yt-dlp = \\{ version = \"[^\"]*\", features = \\[\"tracing\"\\], default-features = false \\}", replace="yt-dlp = { version = \"{{version}}\", features = [\"tracing\"], default-features = false }", exactly=1},
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["reqwest/default", "cache", "tracing"]
cache = ["dep:sqlx"]
tracing = ["dep:tracing"]
rustls = ["reqwest/rustls-tls"]

[dependencies]
# Runtime and async dependencies
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "time", "process"], default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-trait = "0.1"
reqwest = { version = "0.12.24", features = ["json", "stream"], default-features = false }
sqlx = { version = "0.8", optional = true, features = ["sqlite", "runtime-tokio"] }
futures-util = "0.3.31"

# Serialization dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Error handling dependencies
derive_more = { version = "2.0.1", features = ["constructor"] }
thiserror = "2.0.17"

# Audio and video dependencies
mp4ameta = "0.13.0"
id3 = "1.16.3"

# Misc and compression dependencies
ordered-float = { version = "5.1.0", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5"
regex = "1.12.2"
sha2 = "0.10.9"
chrono = "0.4.42"
tar = "0.4.44"
zip = "6.0.0"
xz2 = "0.1.7"
rand = "0.9.2"

# Logging dependencies
tracing = { version = "0.1.41", optional = true }
cfg-if = "1.0.4"
serde_with = "3.16.0"

[store]
dir = "target/nextest"

# Default profile (local development)
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 3 }

# CI profile (no fail-fast, retries on flaky tests)
[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

# ==================== Test Groups ====================

# Unit tests: pure logic, no I/O, no async runtime needed
[test-groups.unit]
max-threads = 16

# Integration tests: wiremock + async runtime + tempdir
[test-groups.integration]
max-threads = 8

# E2E tests: full pipeline, serial execution to avoid port/resource conflicts
[test-groups.e2e]
max-threads = 2

# ==================== Group Rules ====================

[[profile.default.overrides]]
filter = "test(~unit::)"
test-group = "unit"
slow-timeout = { period = "10s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(~integration::)"
test-group = "integration"
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = "test(~e2e::)"
test-group = "e2e"
slow-timeout = { period = "120s", terminate-after = 2 }

# CI overrides
[[profile.ci.overrides]]
filter = "test(~unit::)"
test-group = "unit"
retries = 0
slow-timeout = { period = "15s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "test(~integration::)"
test-group = "integration"
retries = 2
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = "test(~e2e::)"
test-group = "e2e"
retries = 1
slow-timeout = { period = "180s", terminate-after = 2 }

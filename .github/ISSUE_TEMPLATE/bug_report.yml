name: 🐛 Bug Report
description: Report a bug with the yt-dlp crate
title: "🐛 "
labels: ["bug"]
assignees:
  - boul2gom

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: 🔍 Bug description
      description: A clear and concise description of what the bug is.
      placeholder: "When I try to download a video using the `download()` method, it panics with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 📋 Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Create a `Downloader` with `Downloader::new("yt-dlp", "ffmpeg").await?`
        2. Call `downloader.download("https://...").execute().await?`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "The video should be downloaded successfully to the specified output path."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual behavior
      description: A clear and concise description of what actually happened. Include any error messages or stack traces.
      placeholder: |
        The download fails with:
        ```
        Error: IO error during download
        ```
    validations:
      required: true

  - type: dropdown
    id: crate_version
    attributes:
      label: 📦 Crate version
      description: Which version of the `yt-dlp` crate are you using?
      options:
        - 2.7.2 (latest)
        - 2.7.1
        - 2.7.0
        - 1.x
        - Other
    validations:
      required: true

  - type: input
    id: crate_version_other
    attributes:
      label: 📦 Crate version (if "Other")
      description: If you selected "Other" above, please specify the exact version you are using.
      placeholder: "1.0.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating system
      description: Which operating system are you using?
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: features
    attributes:
      label: 🔌 Enabled features
      description: Which optional features do you have enabled?
      multiple: true
      options:
        - cache-memory (default)
        - cache-json
        - cache-redb
        - cache-redis
        - hooks
        - webhooks
        - statistics
        - rustls
    validations:
      required: false

  - type: textarea
    id: code
    attributes:
      label: 🧩 Minimal reproduction code
      description: If possible, provide a minimal code snippet that reproduces the issue.
      render: rust
      placeholder: |
        use yt_dlp::prelude::*;

        #[tokio::main]
        async fn main() -> Result<(), Box<dyn std::error::Error>> {
            let downloader = Downloader::new("yt-dlp", "ffmpeg").await?;
            // ...
            Ok(())
        }

  - type: textarea
    id: context
    attributes:
      label: 📸 Additional context
      description: Add any other context, screenshots, or log output about the problem here.
    validations:
      required: false

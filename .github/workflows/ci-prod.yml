name: "🔌 Github CI - Production"

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sonarcloud-analysis:
    name: 🔍 SonarCloud analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
          
      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  update-version-dropdown:
    name: 🤖 Update version dropdown in bug report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: 🔍 Fetch releases and update dropdown options
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            // Fetch all releases (paginate to get full history)
            const all_releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Keep only yt-dlp releases: tags like "v1.4.12" (excludes "media-seek-v0.x.x")
            const versions = all_releases
              .map(r => r.tag_name)
              .filter(tag => /^v\d+\.\d+\.\d+$/.test(tag))
              .map(tag => tag.replace(/^v/, ''))
              .sort((a, b) => {
                const [aMaj, aMin, aPat] = a.split('.').map(Number);
                const [bMaj, bMin, bPat] = b.split('.').map(Number);
                if (bMaj !== aMaj) return bMaj - aMaj;
                if (bMin !== aMin) return bMin - aMin;
                return bPat - aPat;
              });

            if (versions.length === 0) {
              console.log('⚠️ No yt-dlp releases found, skipping update');
              return;
            }

            // 3 most recent minor/patch versions, with "(latest)" on the first
            const recent = versions.slice(0, 3).map((v, i) => i === 0 ? `${v} (latest)` : v);

            // Distinct major versions not already covered by the recent 3
            const covered_majors = new Set(recent.map(v => v.split('.')[0]));
            const all_majors = [...new Set(versions.map(v => v.split('.')[0]))];
            const extra_majors = all_majors
              .filter(m => !covered_majors.has(m))
              .map(m => `${m}.x`);

            // Final options: recent versions, then older major series, then Other
            const options = [...recent, ...extra_majors, 'Other'];
            console.log(`📦 New dropdown options: ${options.join(', ')}`);

            // Read the template file and replace the options block for crate_version
            const file_path = '.github/ISSUE_TEMPLATE/bug_report.yml';
            const content = fs.readFileSync(file_path, 'utf8');

            const options_yaml = options.map(v => `        - ${v}`).join('\n');
            const updated = content.replace(
              /(  - type: dropdown\n    id: crate_version[\s\S]*?      options:\n)((?:        - [^\n]*\n)*)/,
              (_, prefix) => `${prefix}${options_yaml}\n`
            );

            if (updated === content) {
              console.log('⚠️ Pattern not matched or no changes needed');
              return;
            }

            fs.writeFileSync(file_path, updated, 'utf8');
            console.log('✅ Updated bug_report.yml with new version dropdown');

      - name: 🔐 Import GPG Key and setup Git
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: "boul2gom-bot"
          git_committer_email: "actions-bot@boul2gom.com"

      - name: 🤖 Commit updated version dropdown
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "🤖 Update crate version dropdown in bug report [skip ci]"
          commit_user_name: "boul2gom-bot"
          commit_user_email: "actions-bot@boul2gom.com"
          commit_author: "boul2gom-bot <actions-bot@boul2gom.com>"
name: "🏷️ Issue and PR Labeler"

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    name: "🏷️ Label issues and PRs"

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
          
      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: 🏷️ Analyze and apply labels
        id: labeler
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # GITHUB_TOKEN carries the job-level issues: write + pull-requests: write permissions,
          # which are required to create/apply labels. The App token cannot be used here because
          # the GitHub App installation may not have labels write access configured.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const is_pr = !!context.payload.pull_request;
            const number = is_pr ? context.payload.pull_request.number : context.payload.issue.number;
            const title = (is_pr ? context.payload.pull_request.title : context.payload.issue.title) || '';
            const body = (is_pr ? context.payload.pull_request.body : context.payload.issue.body) || '';
            const text = `${title}\n${body}`.toLowerCase();

            // ═══════════════════════════════════════════════════════════
            // 📋 Global configuration maps
            // ═══════════════════════════════════════════════════════════
            const emoji_map = {
              '🐛': 'bug',
              '✨': 'enhancement',
              '📦': 'dependencies',
              '🔌': 'github_actions',
              '💄': 'refactor',
              '🎨': 'refactor',
              '📚': 'documentation',
              '⚡': 'performance',
              '💥': 'breaking_change',
              '🦀': 'rust',
              '🔒': 'security',
            };

            // Reverse emoji_map: label → first matching emoji
            const label_emoji = Object.entries(emoji_map).reduce((acc, [emoji, label]) => {
              if (!acc[label]) acc[label] = emoji;
              return acc;
            }, {
              'cache': '🔍', 'download': '📥', 'events': '🔔',
              'extractor': '📡', 'metadata': '🏷️', 'media-seek': '⚙️',
            });

            const label_config = {
              'cache':           { color: '0e8a16', description: 'Changes to the caching system' },
              'download':        { color: '1d76db', description: 'Changes to the download pipeline' },
              'events':          { color: 'fbca04', description: 'Changes to hooks, webhooks, or event bus' },
              'extractor':       { color: 'd93f0b', description: 'Changes to video extractors' },
              'metadata':        { color: 'c5def5', description: 'Changes to metadata processing' },
              'media-seek':      { color: '7b68ee', description: 'Changes to the media-seek container parsing crate' },
              'breaking_change': { color: 'b60205', description: 'PR introduces breaking API changes' },
              'performance':     { color: '006b75', description: 'Performance improvements or benchmarks' },
              'refactor':        { color: 'a2eeef', description: 'Code restructuring without behavior changes' },
              'security':        { color: 'e4e669', description: 'Security-related changes or vulnerability fixes' },
            };

            // ═══════════════════════════════════════════════════════════
            // 🤖 Skip bot PRs (Dependabot handles its own labels)
            // ═══════════════════════════════════════════════════════════
            if (is_pr) {
              const author = context.payload.pull_request.user.login;
              if (author.endsWith('[bot]') || author === 'dependabot' || author === 'renovate') {
                console.log(`🤖 Skipping bot PR from ${author}`);
                return;
              }
            }

            const labels_to_add = new Set();

            // ═══════════════════════════════════════════════════════════
            // 📁 File-path based labeling (PRs only)
            // ═══════════════════════════════════════════════════════════
            if (is_pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                per_page: 100
              });

              const paths = files.map(f => f.filename);

              // Module labels — matched against src/ subdirectories
              const module_map = {
                'cache':      /^src\/cache\//,
                'download':   /^src\/download\//,
                'events':     /^src\/events\//,
                'extractor':  /^src\/extractor\//,
                'metadata':   /^src\/metadata\//,
                'media-seek': /^crates\/media-seek\//,
              };

              for (const [label, pattern] of Object.entries(module_map)) {
                if (paths.some(p => pattern.test(p))) {
                  labels_to_add.add(label);
                }
              }

              // Structural labels — matched against file extensions and paths
              if (paths.some(p => p.endsWith('.rs') || p === 'build.rs')) {
                labels_to_add.add('rust');
              }
              if (paths.some(p => p.startsWith('.github/workflows/'))) {
                labels_to_add.add('github_actions');
              }
              if (paths.some(p => p.endsWith('.md') || p.startsWith('docs/'))) {
                labels_to_add.add('documentation');
              }
              if (paths.some(p => p === 'Cargo.toml' || p === 'Cargo.lock')) {
                labels_to_add.add('dependencies');
              }
              if (paths.some(p => p.startsWith('benches/'))) {
                labels_to_add.add('performance');
              }

              // ═════════════════════════════════════════════════════════
              // 🌿 Branch name analysis (PRs only)
              // ═════════════════════════════════════════════════════════
              const branch = (context.payload.pull_request.head.ref || '').toLowerCase();
              const branch_map = [
                { prefixes: ['fix/', 'bugfix/', 'hotfix/'], label: 'bug' },
                { prefixes: ['feat/', 'feature/'],          label: 'enhancement' },
                { prefixes: ['refactor/'],                  label: 'refactor' },
                { prefixes: ['docs/', 'doc/'],              label: 'documentation' },
                { prefixes: ['perf/'],                      label: 'performance' },
              ];
              for (const { prefixes, label } of branch_map) {
                if (prefixes.some(p => branch.startsWith(p))) {
                  labels_to_add.add(label);
                }
              }
            }

            // ═══════════════════════════════════════════════════════════
            // 🎨 Emoji-prefix based labeling (primary — title only)
            // ═══════════════════════════════════════════════════════════
            for (const [emoji, label] of Object.entries(emoji_map)) {
              if (title.includes(emoji)) {
                labels_to_add.add(label);
              }
            }

            // ═══════════════════════════════════════════════════════════
            // 💬 Conventional commit prefixes (title only)
            // ═══════════════════════════════════════════════════════════
            const conventional_map = [
              { pattern: /^fix(\(.+\))?!?:\s/i,      label: 'bug' },
              { pattern: /^feat(\(.+\))?!?:\s/i,     label: 'enhancement' },
              { pattern: /^docs?(\(.+\))?!?:\s/i,    label: 'documentation' },
              { pattern: /^perf(\(.+\))?!?:\s/i,     label: 'performance' },
              { pattern: /^ci(\(.+\))?!?:\s/i,       label: 'github_actions' },
              { pattern: /^refactor(\(.+\))?!?:\s/i, label: 'refactor' },
            ];

            for (const { pattern, label } of conventional_map) {
              if (pattern.test(title)) {
                labels_to_add.add(label);
              }
            }

            // Conventional commits with `!` indicate breaking changes (e.g. `feat!:`, `fix(cache)!:`)
            if (/^\w+(\(.+\))?!:\s/.test(title)) {
              labels_to_add.add('breaking_change');
            }

            // ═══════════════════════════════════════════════════════════
            // 🔍 Keyword-based labeling (fallback — title + body)
            // ═══════════════════════════════════════════════════════════
            const keyword_map = [
              { label: 'bug',             patterns: [/\bbug\b/, /\bcrash/, /\bpanic/, /\bbroken\b/] },
              { label: 'enhancement',     patterns: [/\bfeat(ure)?\b/, /\bimplement/, /\bsupport\b/] },
              { label: 'breaking_change', patterns: [/\bbreaking[ -]?change\b/, /\bBREAKING\b/] },
              { label: 'performance',     patterns: [/\bperf(ormance)?\b/, /\bbench/, /\boptim/, /\bspeed\b/] },
              { label: 'documentation',   patterns: [/\breadme\b/, /\btypo\b/, /\bspelling\b/] },
              { label: 'dependencies',    patterns: [/\bbump\b/, /\bdep(endenc(y|ies))?\b/, /\bupgrade\b/] },
              { label: 'refactor',        patterns: [/\brefactor/, /\brestructure/, /\bcleanup\b/] },
              { label: 'security',        patterns: [/\bsecurity\b/, /\bvulnerabilit/, /\bcve\b/, /\bunsafe\b/, /\bexploit/, /\badvisory\b/] },
            ];

            for (const { label, patterns } of keyword_map) {
              if (!labels_to_add.has(label) && patterns.some(p => p.test(text))) {
                labels_to_add.add(label);
              }
            }

            // ═══════════════════════════════════════════════════════════
            // 🏷️ Apply labels (skip already-present ones)
            // ═══════════════════════════════════════════════════════════
            if (labels_to_add.size === 0) {
              console.log('🏷️ No labels to apply');
              return;
            }

            const current_labels_response = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const current_labels = new Set(current_labels_response.data.map(l => l.name));
            const new_labels = [...labels_to_add].filter(l => !current_labels.has(l));

            if (new_labels.length === 0) {
              console.log('🏷️ All labels already present, nothing to do');
              return;
            }

            // Auto-create missing labels if they don't exist yet
            for (const label of new_labels) {
              if (label_config[label]) {
                try {
                  await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
                } catch (e) {
                  if (e.status === 404) {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label,
                      color: label_config[label].color,
                      description: label_config[label].description,
                    });
                    console.log(`🏷️ Created missing label: ${label}`);
                  }
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: new_labels,
            });

            console.log(`🏷️ Applied labels: ${new_labels.join(', ')}`);

            // ═══════════════════════════════════════════════════════════
            // 📤 Expose data for the comment step
            // ═══════════════════════════════════════════════════════════
            core.setOutput('is_new', context.payload.action === 'opened' ? 'true' : 'false');
            core.setOutput('is_pr', is_pr ? 'true' : 'false');
            core.setOutput('issue_number', String(number));

      - name: 💬 Post welcome comment
        if: steps.labeler.outputs.is_new == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const is_pr = ${{ steps.labeler.outputs.is_pr }};
            const issue_number = ${{ steps.labeler.outputs.issue_number }};
            const pr_comment = `Hi there! 👋\nI have automatically applied some labels to categorize this pull request.\nYour pull request will be reviewed by a maintainer as soon as possible. Thanks for your contribution!`;
            const issue_comment = `Hi there! 👋\nI have automatically applied some labels to categorize this issue.\nYour issue will be reviewed by a maintainer as soon as possible. Thanks for opening it!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: is_pr ? pr_comment : issue_comment,
            });

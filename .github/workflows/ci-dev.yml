name: "🔌 Github CI - Development"

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  check-format:
    name: 💄 Check formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Set up nightly Rust (for rustfmt)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: 💄 Check formatting
        run: cargo +nightly fmt --all -- --check

  dependency-review:
    name: 📦 Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  build-and-test:
    name: 🦀 Build & Test
    runs-on: ubuntu-latest
    needs: [check-spell]
    env:
      CLICOLOR: 1
      REDIS_URL: redis://localhost:6379
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "yt-dlp"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: 🦀 Check with Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: 📦 Build test targets
        run: cargo test --no-run --test unit --test integration --all-features

      - name: 🧪 Run unit tests
        run: cargo test --test unit --all-features

      - name: 🔗 Run integration tests
        run: cargo test --test integration --all-features

  doc-tests:
    name: 📚 Test docs
    needs: [check-spell]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "yt-dlp"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 📚 Run doc tests
        run: cargo test --doc --workspace --all-features

  analysis:
    name: 🔍 Static analysis
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 🛠️ Install cargo-machete
        uses: taiki-e/install-action@6929d36b9cc9bd3c8a031f179ec7f72cffbfc6fa # cargo-machete

      - name: 🧹 Unused dependencies
        run: cargo machete

  e2e-tests:
    name: 🚀 E2E tests
    needs: [build-and-test, doc-tests]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "yt-dlp"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🛠️ Install ffmpeg from boul2gom/ffmpeg-builds
        run: |
          curl -fsSL "https://github.com/boul2gom/ffmpeg-builds/releases/latest/download/ffmpeg-linux-x64.zip" -o /tmp/ffmpeg.zip
          mkdir -p /opt/ffmpeg
          unzip -j /tmp/ffmpeg.zip ffmpeg -d /opt/ffmpeg
          chmod +x /opt/ffmpeg/ffmpeg
          rm /tmp/ffmpeg.zip
          echo "/opt/ffmpeg" >> $GITHUB_PATH

      - name: 🚀 Run E2E tests
        run: cargo test --test e2e --all-features -- --test-threads=1

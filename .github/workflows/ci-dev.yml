name: Github CI - Development

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLICOLOR: 1

jobs:
  setup-and-build:
    name: 🦀 Setup and build
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 📦 Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: ✅ Check with Clippy linter (all feature combinations)
        run: cargo hack clippy --each-feature --exclude-features cache-backend -- -D warnings

      - name: 🦀 Build (all feature combinations)
        run: cargo hack build --each-feature --exclude-features cache-backend

  doc-tests:
    name: 📚 Check format and test docs
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 💄 Check code format
        run: cargo fmt --all -- --check

      - name: 📚 Run doc tests
        run: cargo test --doc

  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: 📝 Check spelling
        uses: crate-ci/typos@v1.43.5

  analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-analysis-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 📦 Install analysis tools
        run: cargo install cargo-machete --locked

      - name: 🧹 Unused dependencies
        run: cargo machete

  semver-checks:
    name: 🔖 Semver compatibility
    runs-on: ubuntu-latest
    # Informational only — never blocks CI. Breaking changes are expected for minor/major releases.
    # The auto-release workflow enforces this check for patch releases.
    continue-on-error: true

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-semver-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🚀 Check Semver compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2.8
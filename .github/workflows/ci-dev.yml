name: "🔌 Github CI - Development"

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================== Build + Lint + Test (feature-complete per backend) ====================

  build-and-test:
    name: 🦀 Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            shared_key: "default"
            cargo_features: ""
            run_integration: true
          - name: full-json
            shared_key: "full-json"
            cargo_features: "--features cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
            run_integration: true
          - name: full-redb
            shared_key: "full-redb"
            cargo_features: "--features cache-memory,cache-redb,hooks,webhooks,statistics,live-recording"
            run_integration: true
          - name: full-redis
            shared_key: "full-redis"
            cargo_features: "--features cache-memory,cache-redis,hooks,webhooks,statistics,live-recording"
            run_integration: false

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: ${{ matrix.name != 'default' }}

      - name: 📦 Cache Rust registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: ${{ matrix.shared_key }}
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: 🦀 Clippy
        run: cargo clippy --workspace ${{ matrix.cargo_features }} -- -D warnings

      - name: 🧪 Run unit tests
        run: cargo test --test unit ${{ matrix.cargo_features }}

      - name: 🔗 Run integration tests
        if: matrix.run_integration
        run: cargo test --test integration ${{ matrix.cargo_features }}

  # ==================== Checks (no compilation — run in parallel) ====================

  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📝 Check spelling
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # v1.44.0

  check-format:
    name: 💄 Check formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠️ Set up nightly Rust (for rustfmt)
        uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
        with:
          components: rustfmt

      - name: 💄 Check formatting
        run: cargo +nightly fmt --all -- --check

  # ==================== Post-build checks (need warm sccache) ====================

  doc-tests:
    name: 📚 Test docs
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: 📦 Cache Rust registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "default"
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 📚 Run doc tests
        run: cargo test --doc --workspace

  # ==================== Redis Integration (needs service container) ====================

  integration-tests-redis:
    name: 🔗 Integration tests (cache-redis)
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: 📦 Cache Rust registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "full-redis"
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🔗 Run integration tests (cache-redis)
        env:
          REDIS_URL: redis://localhost:6379
        run: cargo test --test integration --features "cache-memory,cache-redis,hooks,webhooks,statistics,live-recording"

  # ==================== E2E ====================

  e2e-tests:
    name: 🚀 E2E tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: 📦 Cache Rust registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "full-json"
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🛠️ Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🚀 Run E2E tests
        run: cargo test --test e2e --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording" -- --test-threads=1

  # ==================== Analysis ====================

  analysis:
    name: 🔍 Static analysis
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
        
      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "analysis"
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 📦 Install analysis tools
        run: cargo install cargo-machete --locked

      - name: 🧹 Unused dependencies
        run: cargo machete

      - name: 🚀 Check Semver compatibility (yt-dlp)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: yt-dlp
          feature-group: only-explicit-features
          features: cache-memory,hooks,webhooks,statistics,live-recording,hickory-dns,rustls,profiling

      - name: 🚀 Check Semver compatibility (media-seek)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: media-seek
          feature-group: default-features

  scorecard-analysis:
    name: 🔍 Scorecard analysis
    if: github.event_name == 'push'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      pull-requests: read
      contents: read
      actions: read
      issues: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🔍 Scan with Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload Scorecard scan results artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sarif-results
          path: results.sarif
          retention-days: 5

      - name: 📦 Upload Scorecard scan results to GitHub dashboard
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: results.sarif

  fossa:
    name: 📜 FOSSA license scan
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📜 Run FOSSA scan
        uses: fossas/fossa-action@c414b9ad82eaad041e47a7cf62a4f02411f427a0 # v1.8.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  coverage:
    name: 📊 Code coverage
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
          
      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "coverage"
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: 📦 Install cargo-llvm-cov
        uses: taiki-e/install-action@c1305996457413b456b636a549d9f98354fd89cf # cargo-llvm-cov

      - name: 🛠️ Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📊 Generate coverage (unit + integration + e2e)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --test unit --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
          cargo llvm-cov --no-report --test integration --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
          cargo llvm-cov --no-report --test e2e --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording" -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: 📦 Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # ==================== PR-only checks ====================

  dependency-review:
    name: 📦 Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Review dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

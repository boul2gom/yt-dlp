name: "🔌 Github CI - Development"

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR: 1

permissions:
  contents: read

jobs:
  # ==================== Build + Lint + Test (feature-complete per backend) ====================

  build-and-test:
    name: 🦀 Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            shared_key: "default"
            cargo_features: ""
            run_integration: true
          - name: full-json
            shared_key: "full-json"
            cargo_features: "--features cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
            run_integration: true
          - name: full-redb
            shared_key: "full-redb"
            cargo_features: "--features cache-memory,cache-redb,hooks,webhooks,statistics,live-recording"
            run_integration: true
          - name: full-redis
            shared_key: "full-redis"
            cargo_features: "--features cache-memory,cache-redis,hooks,webhooks,statistics,live-recording"
            run_integration: false

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # sccache intercepts individual rustc calls and caches them across parallel matrix variants.
      # Combined with cache-targets: false on rust-cache, this avoids duplicating the same dep
      # compilations (tokio, reqwest, serde…) across the 4 feature variants.
      - name: 📦 Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: 📦 Cache Rust registry
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: ${{ matrix.shared_key }}
          # target/ is handled by sccache; rust-cache only manages ~/.cargo/registry here
          cache-targets: false

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 🦀 Clippy
        run: cargo clippy --workspace ${{ matrix.cargo_features }} -- -D warnings

      - name: 🧪 Run unit tests
        run: cargo test --test unit ${{ matrix.cargo_features }}

      - name: 🔗 Run integration tests
        if: matrix.run_integration
        run: cargo test --test integration ${{ matrix.cargo_features }}

  # ==================== Checks ====================

  doc-tests:
    name: 📚 Test docs
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # Restores the target/ saved by build-and-test (default): doc tests share the same feature set.
      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: "default"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📚 Run doc tests
        run: cargo test --doc --workspace

  check-spell:
    name: 📝 Check spelling
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: 📝 Check spelling
        uses: crate-ci/typos@v1.44.0

  check-format:
    name: 💄 Check formatting
    if: github.event_name == 'pull_request'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Set up nightly Rust (for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: 💄 Check formatting
        run: cargo +nightly fmt --all -- --check

  # ==================== Redis Integration (needs service container) ====================

  integration-tests-redis:
    name: 🔗 Integration tests (cache-redis)
    needs: [build-and-test, doc-tests, check-spell]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # Restores the target/ saved by build-and-test (full-redis): same feature set.
      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: "full-redis"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🔗 Run integration tests (cache-redis)
        env:
          REDIS_URL: redis://localhost:6379
        run: cargo test --test integration --features "cache-memory,cache-redis,hooks,webhooks,statistics,live-recording"

  # ==================== E2E ====================

  e2e-tests:
    name: 🚀 E2E tests
    needs: [build-and-test, doc-tests, check-spell, integration-tests-redis]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # Restores the target/ saved by build-and-test (full-json): same feature set.
      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: "full-json"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🚀 Run E2E tests
        run: cargo test --test e2e --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording" -- --test-threads=1

  # ==================== Analysis ====================

  analysis:
    name: 🔍 Static analysis
    needs: [build-and-test, doc-tests, check-spell]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # cargo-semver-checks compiles with --release and unique features: keep an isolated key.
      # cargo deny and cargo machete don't compile but benefit from the registry cache.
      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: "analysis"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 📦 Install analysis tools
        run: cargo install cargo-machete --locked

      - name: 🧹 Unused dependencies
        run: cargo machete

      - name: 🚀 Check Semver compatibility (yt-dlp)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2.8
        with:
          package: yt-dlp
          feature-group: only-explicit-features
          features: cache-memory,hooks,webhooks,statistics,live-recording,hickory-dns,rustls,profiling

      - name: 🚀 Check Semver compatibility (media-seek)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2.8
        with:
          package: media-seek
          feature-group: default-features

  scorecard-analysis:
    name: 🔍 Scorecard analysis
    if: github.event_name == 'push'
    needs: [build-and-test, doc-tests, check-spell, integration-tests-redis]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🔍 Scan with Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 🧹 Filter Pinned-Dependencies from SARIF results
        run: |
          jq 'del(.runs[].results[] | select(.ruleId == "PinnedDependencies"))' results.sarif > results-filtered.sarif
          mv results-filtered.sarif results.sarif

      - name: 📦 Upload Scorecard scan results artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: sarif-results
          path: results.sarif
          retention-days: 5

      - name: 📦 Upload Scorecard scan results to GitHub dashboard
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  fossa:
    name: 📜 FOSSA license scan
    needs: [build-and-test, doc-tests, check-spell, integration-tests-redis]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📜 Run FOSSA scan
        uses: fossas/fossa-action@v1.8.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  coverage:
    name: 📊 Code coverage
    needs: [build-and-test, doc-tests, check-spell, integration-tests-redis]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      # cargo llvm-cov adds -C instrument-coverage: artifacts are incompatible with normal builds.
      # Isolated key avoids polluting the shared caches used by other jobs.
      - name: 📦 Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: "coverage"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 📦 Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 🛠️ Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📊 Generate coverage (unit + integration + e2e)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --test unit --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
          cargo llvm-cov --no-report --test integration --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording"
          cargo llvm-cov --no-report --test e2e --features "cache-memory,cache-json,hooks,webhooks,statistics,live-recording" -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: 📦 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
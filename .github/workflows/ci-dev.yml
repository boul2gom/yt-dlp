name: Github CI - Development

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLICOLOR: 1

jobs:
  build-each-feature:
    name: 🦀 Setup and build (each feature)
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 📦 Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: ✅ Clippy (each feature in isolation)
        run: cargo hack clippy --each-feature --exclude-all-features -- -D warnings

      - name: 🦀 Build (each feature in isolation)
        run: cargo hack build --each-feature --exclude-all-features

  build-tiered-cache:
    name: 🦀 Setup and build (tiered L1+L2 cache combinations)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [cache-json, cache-redb, cache-redis]

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: ✅ Clippy (cache-memory + ${{ matrix.backend }})
        run: cargo clippy --features cache-memory,${{ matrix.backend }} -- -D warnings

      - name: 🦀 Build (cache-memory + ${{ matrix.backend }})
        run: cargo build --features cache-memory,${{ matrix.backend }}

  doc-tests:
    name: 📚 Check format and test docs
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 💄 Check code format
        run: cargo fmt --all -- --check

      - name: 📚 Run doc tests
        run: cargo test --doc

  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: 📝 Check spelling
        uses: crate-ci/typos@v1.43.5

  analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-analysis-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 📦 Install analysis tools
        run: cargo install cargo-machete --locked

      - name: 🧹 Unused dependencies
        run: cargo machete

      - name: 🚀 Check Semver compatibility
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2.8
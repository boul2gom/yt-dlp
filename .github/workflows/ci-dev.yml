name: Github CI - Development

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR: 1

permissions:
  contents: read

jobs:
  build-each-feature:
    name: 🦀 Setup and build (each feature)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 📦 Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: 🦀 Clippy (each feature in isolation)
        run: cargo hack clippy --each-feature --exclude-all-features -- -D warnings

  build-tiered-cache:
    name: 🦀 Setup and build (L1+L2, cache-memory + ${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        backend: [cache-json, cache-redb, cache-redis]

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 🦀 Clippy (cache-memory + ${{ matrix.backend }})
        run: cargo clippy --features cache-memory,${{ matrix.backend }} -- -D warnings

  check-format:
    name: 💄 Check formatting
    if: github.event_name == 'pull_request'
    needs: [build-each-feature, build-tiered-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Set up nightly Rust (for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: 💄 Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: 🧹 Check trailing blank lines
        run: |
          bad=$(find src examples benches -name '*.rs' -exec sh -c 'tail -c 2 "$1" | xxd -p | grep -q "0a0a" && echo "$1"' _ {} \;)
          if [ -n "$bad" ]; then
            echo "Files with trailing blank lines:"
            echo "$bad"
            exit 1
          fi

  doc-tests:
    name: 📚 Test docs
    needs: [build-each-feature, build-tiered-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📚 Run doc tests
        run: cargo test --doc

  check-spell:
    name: 📝 Check spelling
    needs: [build-each-feature, build-tiered-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: 📝 Check spelling
        uses: crate-ci/typos@v1.43.5

  analysis:
    name: 🔍 Static Analysis
    needs: [doc-tests, check-spell]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2.8.2
        with:
          prefix-key: rust-analysis-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 📦 Install analysis tools
        run: cargo install cargo-machete --locked

      - name: 🧹 Unused dependencies
        run: cargo machete

      - name: 🚀 Check Semver compatibility
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2.8
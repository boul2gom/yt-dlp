name: "📦 Github CI - Automatic weekly release"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_major:
        description: 'Force a major version bump for the chosen crate (patch/minor are otherwise determined by semver-checks)'
        required: false
        type: choice
        options:
          - none
          - yt-dlp
          - media-seek
        default: 'none'

jobs:
  check_updates:
    name: ✅ Check update commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      one_has:        ${{ steps.check_commits.outputs.one_has }}
      has_updates:    ${{ steps.check_commits.outputs.main_has }}
      has_ms_updates: ${{ fromJSON(steps.check_commits.outputs.sub_results)['media-seek'] }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: ✅ Check unreleased commits
        id: check_commits
        uses: boul2gom/actions/unreleased-commits@0aedeaa11b966fd08ab4d756c33ef76a1638ddac # v1.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_patterns: "[Github Actions],[skip ci]"
          sub_projects: |
            media-seek:crates/media-seek/

  check_status:
    name: ✅ Check Github CI - Development status
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ci_success: ${{ steps.check_ci.outputs.ci_success }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: ✅ Check CI status
        id: check_ci
        uses: boul2gom/actions/ci-status@0aedeaa11b966fd08ab4d756c33ef76a1638ddac # v1.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver_gate:
    name: 🔖 Semver compatibility gate
    needs: [check_updates, check_status]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_type: ${{ steps.resolve.outputs.resolved_type }}
      resolved_ms_type: ${{ steps.resolve_ms.outputs.resolved_type }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: rust-semver-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🚀 Check Semver compatibility (yt-dlp)
        id: semver
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: yt-dlp
          feature-group: all-features

      - name: 🚀 Check Semver compatibility (media-seek)
        id: semver_ms
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: media-seek
          feature-group: default-features

      - name: 🔍 Resolve release type (yt-dlp)
        id: resolve
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        run: |
          if [[ "${{ github.event.inputs.force_major }}" == "yt-dlp" ]]; then
            echo "📌 Forced major release for yt-dlp"
            echo "resolved_type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.semver.outcome }}" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Resolve release type (media-seek)
        id: resolve_ms
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        run: |
          if [[ "${{ github.event.inputs.force_major }}" == "media-seek" ]]; then
            echo "📌 Forced major release for media-seek"
            echo "resolved_type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.semver_ms.outcome }}" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing media-seek as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing media-seek as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

  create_release:
    name: 🔖 Create a new release
    needs: [check_updates, check_status, semver_gate]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          
      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
  
      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 📌 Install cargo-release
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-release
        with:
          tool: cargo-release

      - name: 🔐 Import GPG Key and setup Git
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: "boul2gom-bot"
          git_committer_email: "actions-bot@boul2gom.com"

      - name: 🚀 Publish media-seek to crates.io
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p media-seek ${{ needs.semver_gate.outputs.resolved_ms_type }} --execute --no-confirm

      - name: 🚀 Create a new ${{ needs.semver_gate.outputs.resolved_type }} release (yt-dlp)
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p yt-dlp ${{ needs.semver_gate.outputs.resolved_type }} --execute --no-confirm

      - name: 🔍 Get new version
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yt-dlp") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate release notes
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: generate_release_notes
        uses: boul2gom/actions/release-notes@0aedeaa11b966fd08ab4d756c33ef76a1638ddac # v1.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          sub_projects: |
            media-seek:crates/media-seek/

      - name: 📝 Create GitHub Release
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 🔖 v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.generate_release_notes.outputs.release_notes }}

  update_version_dropdown:
    name: 🤖 Update version dropdown in bug report
    needs: [check_updates, create_release]
    if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: 🤖 Update version dropdown
        uses: boul2gom/actions/versions-dropdown@0aedeaa11b966fd08ab4d756c33ef76a1638ddac # v1.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
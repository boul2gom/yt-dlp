name: "📦 Github CI - Automatic weekly release"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force the release even if no updates are found'
        type: boolean
        default: false
      target:
        description: 'Which crate(s) to release'
        required: false
        type: choice
        options:
          - both
          - media-seek
          - yt-dlp
        default: 'both'
      release_type:
        description: 'Version bump level for yt-dlp (Ignored if target is "media-seek"). Auto = detect via semver-checks'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: 'auto'
      release_type_ms:
        description: 'Version bump level for media-seek (Ignored if target is "yt-dlp"). Auto = detect via semver-checks'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: 'auto'

permissions:
  contents: read

jobs:
  check_updates:
    name: ✅ Check update commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      one_has: ${{ steps.check_commits.outputs.one_has }}
      has_updates: ${{ steps.check_commits.outputs.has_updates }}
      has_ms_updates: ${{ steps.check_commits.outputs.has_ms_updates }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 100

      - name: 🔍 Check for unreleased commits (per crate)
        id: check_commits
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let last_tag_date = new Date(0);
            try {
              const tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });

              if (tags.data.length > 0) {
                const last_tag = tags.data[0];
                const tag_commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: last_tag.commit.sha
                });
                last_tag_date = new Date(tag_commit.data.commit.committer.date);
                console.log(`🏷️ Last tag found: ${last_tag.name}`);
                console.log(`🏷️ Last tag date: ${last_tag_date.toISOString()}`);
              } else {
                console.log('No tags found');
              }
            } catch (error) {
              console.log('Error while fetching tags:', error.message);
            }

            const last_release = releases.data[0];
            const last_release_date = last_release ? new Date(last_release.created_at) : new Date(0);
            const reference_date = new Date(Math.max(last_release_date.getTime(), last_tag_date.getTime()));

            console.log(`📅 Reference date: ${reference_date.toISOString()}`);

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: reference_date.toISOString()
            });

            // Exclude GitHub Actions workflow bumps — they should not trigger a release
            const relevant_commits = commits.data.filter(c =>
              !c.commit.message.includes('[Github Actions]')
            );

            if (relevant_commits.length === 0) {
              console.log('✨ No unreleased updates found');
              core.setOutput('one_has', 'false');
              core.setOutput('has_updates', 'false');
              core.setOutput('has_ms_updates', 'false');
              return;
            }

            // Classify each commit by the files it touched
            let has_updates = false;
            let has_ms_updates = false;

            for (const commit of relevant_commits) {
              const message = commit.commit.message.split('\n')[0];
              try {
                const detail = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: commit.sha
                });
                const files = (detail.data.files || []).map(f => f.filename);
                const touches_ms = files.some(f => f.startsWith('crates/media-seek/'));
                const touches_ytdlp = files.some(f => !f.startsWith('crates/media-seek/'));

                if (touches_ms) {
                  console.log(`📦 [media-seek] ${message}`);
                  has_ms_updates = true;
                }
                if (touches_ytdlp) {
                  console.log(`📦 [yt-dlp]     ${message}`);
                  has_updates = true;
                }
              } catch (error) {
                // If file details are unavailable, assume both crates are affected
                console.log(`⚠️ Could not fetch files for ${commit.sha}: ${error.message} — assuming both`);
                has_updates = true;
                has_ms_updates = true;
              }

              if (has_updates && has_ms_updates) break;
            }

            // Override with force_release input
            if ('${{ github.event.inputs.force_release }}' === 'true') {
              console.log('🚀 Force release enabled — overriding commit analysis results');
              has_updates = true;
              has_ms_updates = true;
            }

            // Apply target filter (ignored during cron jobs since target will be empty)
            const target = '${{ github.event.inputs.target }}';
            if (target === 'media-seek') {
              console.log('🎯 Target is media-seek only — ignoring yt-dlp');
              has_updates = false;
            } else if (target === 'yt-dlp') {
              console.log('🎯 Target is yt-dlp only — ignoring media-seek');
              has_ms_updates = false;
            }

            console.log(`🎯 Final status -> yt-dlp updates: ${has_updates} | media-seek updates: ${has_ms_updates}`);

            core.setOutput('one_has', (has_updates || has_ms_updates).toString());
            core.setOutput('has_updates', has_updates.toString());
            core.setOutput('has_ms_updates', has_ms_updates.toString());

  check_status:
    name: ✅ Check Github CI - Development status
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ci_success: ${{ steps.check_ci.outputs.ci_success }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 🔍 Check if last CI run was successful
        id: check_ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci-dev.yml",
              branch: "develop",
              per_page: 1
            });
            
            const is_success = runs.data.workflow_runs.length > 0 && runs.data.workflow_runs[0].conclusion === "success";
            core.setOutput("ci_success", is_success ? "true" : "false");

  semver_gate:
    name: 🔖 Semver compatibility gate
    needs: [check_updates, check_status]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_type: ${{ steps.resolve.outputs.resolved_type }}
      resolved_ms_type: ${{ steps.resolve_ms.outputs.resolved_type }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: rust-semver-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🚀 Check Semver compatibility (yt-dlp)
        id: semver
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: yt-dlp
          feature-group: only-explicit-features
          features: cache-memory,hooks,webhooks,statistics,live-recording,hickory-dns,rustls,profiling

      - name: 🚀 Check Semver compatibility (media-seek)
        id: semver_ms
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: media-seek
          feature-group: default-features

      - name: 🔍 Resolve release type (yt-dlp)
        id: resolve
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        run: |
          EXPLICIT_TYPE="${{ github.event.inputs.release_type }}"
          SEMVER_OUTCOME="${{ steps.semver.outcome }}"

          if [[ "$EXPLICIT_TYPE" != "" && "$EXPLICIT_TYPE" != "auto" ]]; then
            echo "📌 Explicit release type: $EXPLICIT_TYPE"
            echo "resolved_type=$EXPLICIT_TYPE" >> $GITHUB_OUTPUT
          elif [[ "$SEMVER_OUTCOME" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Resolve release type (media-seek)
        id: resolve_ms
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        run: |
          EXPLICIT_TYPE="${{ github.event.inputs.release_type_ms }}"
          SEMVER_OUTCOME="${{ steps.semver_ms.outcome }}"

          if [[ "$EXPLICIT_TYPE" != "" && "$EXPLICIT_TYPE" != "auto" ]]; then
            echo "📌 Explicit release type: $EXPLICIT_TYPE"
            echo "resolved_type=$EXPLICIT_TYPE" >> $GITHUB_OUTPUT
          elif [[ "$SEMVER_OUTCOME" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing media-seek as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing media-seek as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

  create_release:
    name: 🔖 Create a new release
    needs: [check_updates, check_status, semver_gate]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
  
      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Changed to 0 to fetch all history for changelog generation
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 📌 Install cargo-release
        run: cargo install cargo-release

      - name: 🔐 Import GPG Key and setup Git
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: "boul2gom-bot"
          git_committer_email: "actions-bot@boul2gom.com"

      - name: 🚀 Publish media-seek to crates.io
        if: ${{ needs.check_updates.outputs.has_ms_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p media-seek ${{ needs.semver_gate.outputs.resolved_ms_type }} --execute --no-confirm

      - name: 🚀 Create a new ${{ needs.semver_gate.outputs.resolved_type }} release (yt-dlp)
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p yt-dlp ${{ needs.semver_gate.outputs.resolved_type }} --execute --no-confirm

      - name: 🔍 Get new version
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yt-dlp") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate releases notes
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: generate_release_notes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let last_tag_date = new Date(0);
            try {
              const tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 2
              });

              if (tags.data.length > 1) {
                const previous_tag = tags.data[1];
                const tag_commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: previous_tag.commit.sha
                });
                last_tag_date = new Date(tag_commit.data.commit.committer.date);
                console.log(`🏷️ Previous tag found: ${previous_tag.name}`);
                console.log(`🏷️ Previous tag date: ${last_tag_date.toISOString()}`);
              } else {
                console.log('No previous tag found');
              }
            } catch (error) {
              console.log('Error while fetching tags:', error.message);
            }

            const last_release = releases.data[0];
            const last_release_date = last_release ? new Date(last_release.created_at) : new Date(0);
            const reference_date = new Date(Math.max(last_release_date.getTime(), last_tag_date.getTime()));

            console.log(`📅 Reference date: ${reference_date.toISOString()}`);
            console.log(`  - Last release: ${last_release_date.toISOString()}`);
            console.log(`  - Previous tag: ${last_tag_date.toISOString()}`);

            console.log('🔍 Fetching commits since previous tag/release...');
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: reference_date.toISOString()
            });

            let release_notes = `## 🚀 Release v${{ steps.get_version.outputs.version }}\n\n`;

            const categories = {
              features: [],
              bug_fixes: [],
              refactors: [],
              dependencies: []
            };

            for (const commit of commits.data) {
              const message = commit.commit.message.split('\n')[0];
              
              if (message.startsWith('🔖') || message.match(/v\d+\.\d+\.\d+(-[a-z0-9.]+)?$/)) {
                console.log(`Skipping pre-release commit: ${message}`);
                continue;
              }

              if (message.includes('Format code with Cargo formatter [skip ci]')) {
                console.log(`Skipping formatting commit: ${message}`);
                continue;
              }

              // Use local git command instead of API to avoid rate limiting and speed up process
              try {
                const execSync = require('child_process').execSync;
                const filesOutput = execSync(`git diff-tree --no-commit-id --name-only -r ${commit.sha}`).toString().trim();
                const files = filesOutput ? filesOutput.split('\n') : [];
                
                const only_media_seek = files.length > 0 && files.every(f => f.startsWith('crates/media-seek/'));
                if (only_media_seek) {
                  console.log(`Skipping media-seek-only commit: ${message}`);
                  continue;
                }
              } catch (error) {
                console.log(`Error checking local files for ${commit.sha}: ${error.message}`);
              }

              const author = commit.author ? commit.author.login : commit.commit.author.name;
              const sha = commit.sha.substring(0, 7);
              const pr_match = message.match(/\(#(\d+)\)/);
              const pr_number = pr_match ? pr_match[1] : null;
              
              const commit_entry = `${message} - by @${author}${pr_number ? ` in #${pr_number}` : ''} (${sha})`;

              const deps_tags = ["bump", "update", "dependencies", "dependency", "cargo.lock", "pinning", "📌", "🔌"]
              const bug_tags = ["fix", "bug", "error", "patch", "hotfix", "🐛", "🚑"]
              const refactor_tags = ["refactor", "format", "lint", "cleanup", "rename", "restructure", "💄", "🎨"]
              
              const message_lower = message.toLowerCase();
              if (deps_tags.some(tag => message_lower.includes(tag))) {
                categories.dependencies.push(commit_entry);
              } else if (bug_tags.some(tag => message_lower.includes(tag))) {
                categories.bug_fixes.push(commit_entry);
              } else if (refactor_tags.some(tag => message_lower.includes(tag))) {
                categories.refactors.push(commit_entry);
              } else {
                categories.features.push(commit_entry);
              }
            }

            if (categories.features.length > 0) {
              release_notes += `✨ Features\n`;
              categories.features.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            if (categories.bug_fixes.length > 0) {
              release_notes += `🐛 Bug Fixes\n`;
              categories.bug_fixes.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            if (categories.refactors.length > 0) {
              release_notes += `💄 Refactors\n`;
              categories.refactors.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            if (categories.dependencies.length > 0) {
              release_notes += `📦 Dependencies Updates\n`;
              categories.dependencies.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
            }
            
            core.setOutput('release_notes', release_notes);

      - name: 📝 Create GitHub Release
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 🔖 v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.generate_release_notes.outputs.release_notes }}
name: Github CI - Automatic weekly release

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force the release even if no Dependabot updates are found'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check_updates:
    name: ✅ Check Dependabot update commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      has_updates: ${{ steps.check_commits.outputs.has_updates }}

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 100

      - name: 🔍 Check for unreleased Dependabot commits
        id: check_commits
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let last_tag_date = new Date(0);
            try {
              const tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });

              if (tags.data.length > 0) {
                const last_tag = tags.data[0];
                const tag_commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: last_tag.commit.sha
                });
                last_tag_date = new Date(tag_commit.data.commit.committer.date);
                console.log(`🏷️ Last tag found: ${last_tag.name}`);
                console.log(`🏷️ Last tag date: ${last_tag_date.toISOString()}`);
              } else {
                console.log('No tags found');
              }
            } catch (error) {
              console.log('Error while fetching tags:', error.message);
            }

            const last_release = releases.data[0];
            const last_release_date = last_release ? new Date(last_release.created_at) : new Date(0);
            const reference_date = new Date(Math.max(last_release_date.getTime(), last_tag_date.getTime()));

            console.log(`📅 Reference date: ${reference_date.toISOString()}`);
            console.log(`  - Last release: ${last_release_date.toISOString()}`);
            console.log(`  - Last tag: ${last_tag_date.toISOString()}`);

            console.log('🔍 Fetching commits since last tag/release...');
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: reference_date.toISOString()
            });

            const merged_commits = commits.data.filter(commit => {
              const is_dependabot = 
                commit.author?.login === 'dependabot[bot]' &&
                commit.commit.author.email.includes('dependabot[bot]')
              
              const has_bump_message = commit.commit.message.includes('Bump ');
              
              // Standard format or alternative format
              const is_standard_format = 
                commit.commit.message.includes(' from ') && 
                commit.commit.message.includes(' to ');

              return is_dependabot && has_bump_message;
            });

            const has_unreleased_updates = merged_commits.length > 0;

            if (has_unreleased_updates) {
              console.log('📦 Found unreleased Dependabot updates:');
              merged_commits.forEach(commit => {
                const message = commit.commit.message.split('\n')[0];
                console.log(`- ${message}`);
                
                // Check if the message matches the standard Dependabot format
                const regex_match = message.match(/Bump (.*?) from (.*?) to (.*?)( |$)/);
                
                if (regex_match) {
                  const [package_name, from_version, to_version] = regex_match.slice(1);
                  console.log(`  Package: ${package_name}`);
                  console.log(`  Version: ${from_version} → ${to_version}`);
                } else {
                  // Alternative or custom format
                  let package_name = "Unknown package";
                  
                  // Format: 🔌 [Github Actions] Bump SonarSource/sonarcloud-github-action (#25)
                  const github_actions_match = message.match(/\[Github Actions\] Bump ([^\s(]+)/);
                  if (github_actions_match) {
                    package_name = github_actions_match[1];
                  } else {
                    // Alternative standard format: Bump package-name
                    const standard_match = message.match(/Bump ([^\s(]+)/);
                    if (standard_match) {
                      package_name = standard_match[1];
                    }
                  }
                  
                  console.log(`  Package: ${package_name}`);
                }
                
                console.log(`  Date: ${new Date(commit.commit.author.date).toISOString()}`);
              });
            } else {
              console.log('✨ No unreleased Dependabot updates found');
            }

            core.setOutput("has_updates", has_unreleased_updates.toString());

  check_status:
    name: ✅ Check Github CI - Development status
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ci_success: ${{ steps.check_ci.outputs.ci_success }}
    steps:
      - name: 🔍 Check if last CI run was successful
        id: check_ci
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci-dev.yml",
              branch: "develop",
              status: "success",
              per_page: 1
            });
            
            core.setOutput("ci_success", runs.data.workflow_runs.length > 0 ? "true" : "false");

  create_release:
    name: 🔖 Create a new release
    needs: [check_updates, check_status]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && (needs.check_updates.outputs.has_updates == 'true' || github.event.inputs.force_release == 'true') }}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 100

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: 📌 Install cargo-release
        run: cargo install cargo-release

      - name: 🪪 Set up Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 🚀 Create a new patch release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release patch --execute --no-confirm

      - name: 🔍 Get new version
        id: get_version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> $GITHUB_ENV

      - name: 📝 Generate releases notes
        id: generate_release_notes
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let last_tag_date = new Date(0);
            try {
              const tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 2  // Get the last 2 tags
              });

              if (tags.data.length > 1) {  // We need at least 2 tags
                const previous_tag = tags.data[1];  // Get the previous tag (before the one we just created)
                const tag_commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: previous_tag.commit.sha
                });
                last_tag_date = new Date(tag_commit.data.commit.committer.date);
                console.log(`🏷️ Previous tag found: ${previous_tag.name}`);
                console.log(`🏷️ Previous tag date: ${last_tag_date.toISOString()}`);
              } else {
                console.log('No previous tag found');
              }
            } catch (error) {
              console.log('Error while fetching tags:', error.message);
            }

            const last_release = releases.data[0];
            const last_release_date = last_release ? new Date(last_release.created_at) : new Date(0);
            const reference_date = new Date(Math.max(last_release_date.getTime(), last_tag_date.getTime()));

            console.log(`📅 Reference date: ${reference_date.toISOString()}`);
            console.log(`  - Last release: ${last_release_date.toISOString()}`);
            console.log(`  - Previous tag: ${last_tag_date.toISOString()}`);

            console.log('🔍 Fetching commits since previous tag/release...');
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: reference_date.toISOString()
            });

            let release_notes = `## 🚀 Release v${{ env.version }}\n\n`;

            // Categorize commits
            const categories = {
              features: [],
              bug_fixes: [],
              refactors: [],
              dependencies: []
            };

            commits.data.forEach(commit => {
              const message = commit.commit.message.split('\n')[0];
              
              if (message.startsWith('🚧') || message.match(/v\d+\.\d+\.\d+(-[a-z0-9.]+)?$/)) {
                console.log(`Skipping pre-release commit: ${message}`);
                return;
              }
              
              const author = commit.author ? commit.author.login : commit.commit.author.name;
              const sha = commit.sha.substring(0, 7);
              const pr_match = message.match(/\(#(\d+)\)/);
              const pr_number = pr_match ? pr_match[1] : null;
              
              const commit_entry = `${message} - by @${author}${pr_number ? ` in #${pr_number}` : ''} (${sha})`;

              const deps_tags = ["bump", "update"]
              const bug_tags = ["fix", "bug", "error"]
              const refactor_tags = ["refactor", "format", "lint"]
              
              // Categorize based on message content
              const message_lower = message.toLowerCase();
              if (deps_tags.some(tag => message_lower.includes(tag))) {
                categories.dependencies.push(commit_entry);
              } else if (bug_tags.some(tag => message_lower.includes(tag))) {
                categories.bug_fixes.push(commit_entry);
              } else if (refactor_tags.some(tag => message_lower.includes(tag))) {
                categories.refactors.push(commit_entry);
              } else {
                categories.features.push(commit_entry);
              }
            });

            // Add features section if there are any
            if (categories.features.length > 0) {
              release_notes += `🚀 Features\n`;
              categories.features.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            // Add bug fixes section if there are any
            if (categories.bug_fixes.length > 0) {
              release_notes += `🐛 Bug Fixes\n`;
              categories.bug_fixes.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            // Add refactors section if there are any
            if (categories.refactors.length > 0) {
              release_notes += `💄 Refactors\n`;
              categories.refactors.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
              release_notes += '\n';
            }

            // Add dependencies section if there are any
            if (categories.dependencies.length > 0) {
              release_notes += `📦 Dependencies Updates\n`;
              categories.dependencies.forEach(entry => {
                release_notes += `- ${entry}\n`;
              });
            }
            
            core.setOutput('release_notes', release_notes);

      - name: 📝 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.version }}
          release_name: 🔖 v${{ env.version }}
          draft: false
          prerelease: false
          body: ${{ steps.generate_release_notes.outputs.release_notes }}

  trigger-workflow:
    name: 🚀 Trigger CI-Prod Workflow
    runs-on: ubuntu-latest
    needs: create_release

    steps:
      - name: 🔌 Trigger CI-Prod Workflow
        uses: benc-uk/workflow-dispatch@v1.2.4
        with:
          workflow: ci-prod.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: '{ "tag": "v${{ needs.create_release.outputs.version }}" }'
